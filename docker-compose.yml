services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: ai-trading-freqtrade
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FREQTRADE__API_SERVER__ENABLED: "true"
      FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS: "0.0.0.0"
      FREQTRADE__API_SERVER__LISTEN_PORT: "8080"
      FREQTRADE__API_SERVER__VERBOSITY: "error"
      FREQTRADE__API_SERVER__ENABLE_OPENAPI: "false"
      FREQTRADE__EXCHANGE__KEY: "${KRAKEN_API_KEY:?set in private .env}"
      FREQTRADE__EXCHANGE__SECRET: "${KRAKEN_API_SECRET:?set in private .env}"
      FREQTRADE__DRY_RUN: "true"
      FREQTRADE__API_SERVER__USERNAME: "${FREQTRADE_UI_USERNAME:?set in private .env}"
      FREQTRADE__API_SERVER__PASSWORD: "${FREQTRADE_UI_PASSWORD:?set in private .env}"
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: "${FREQTRADE_UI_JWT:?set in private .env}"
      FREQTRADE__API_SERVER__WS_TOKEN: "${FREQTRADE_UI_WS_TOKEN:?set in private .env}"
    volumes:
      - ./user_data/config.dryrun.json:/freqtrade/user_data/config.dryrun.json:ro
      - ./user_data/strategies:/freqtrade/user_data/strategies:ro
      - freqtrade_runtime:/freqtrade/runtime
    command: >
      trade
      --logfile /freqtrade/runtime/freqtrade.log
      --db-url sqlite:////freqtrade/runtime/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/config.dryrun.json
      --strategy MoussaBaseline

  supervisor:
    image: python:3.12-slim
    container_name: ai-trading-supervisor
    restart: unless-stopped
    depends_on:
      - freqtrade
    volumes:
      - freqtrade_runtime:/app/runtime:ro
      - ./user_data/reports:/app/reports
      - /var/lib/jarvis/runtime/trading:/app/jarvis-trading
      - ./supervisor:/app/supervisor:ro
    environment:
      RUNTIME_DIR: /app/runtime
      REPORTS_DIR: /app/reports
      JARVIS_REPORT_FILE: /app/jarvis-trading/latest.json
      ACTIVE_STRATEGY: MoussaBaseline
      STRATEGY_VALIDATION_STATE: research_only
      GITHUB_REPO: mimzyflow/ai-trading-supervisor
      GITHUB_STATUS_ISSUE: "1"
      GITHUB_STATUS_TOKEN: ${GITHUB_STATUS_TOKEN:-}
      REPORT_INTERVAL_SECONDS: "300"
      PUBLISH_INTERVAL_SECONDS: "3600"
    working_dir: /app
    command: python supervisor/loop.py

volumes:
  freqtrade_runtime:
    name: ai-trading-freqtrade-runtime
    external: true
