services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: ai-trading-freqtrade
    restart: unless-stopped
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/config.dryrun.json
      --strategy MoussaBaseline

  supervisor:
    image: python:3.12-slim
    container_name: ai-trading-supervisor
    restart: unless-stopped
    depends_on:
      - freqtrade
    volumes:
      - ./user_data:/app/user_data
      - ./supervisor:/app/supervisor:ro
    environment:
      GITHUB_REPO: mimzyflow/ai-trading-supervisor
      GITHUB_STATUS_ISSUE: "1"
      GITHUB_STATUS_TOKEN: ${GITHUB_STATUS_TOKEN:-}
    working_dir: /app
    command: >
      sh -c 'mkdir -p user_data/reports &&
      while true; do python supervisor/report.py;
      python supervisor/publish_github_issue.py || true;
      sleep 3600; done'
