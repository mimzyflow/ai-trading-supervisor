services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.9@sha256:9d67afb8eb5f4e1210f4fb067efcbd5e005bd4f1c27f6f3888b8b9fc7f9b5199
    container_name: ai-trading-freqtrade
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FREQTRADE__API_SERVER__ENABLED: "true"
      FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS: "0.0.0.0"
      FREQTRADE__API_SERVER__LISTEN_PORT: "8080"
      FREQTRADE__API_SERVER__VERBOSITY: "error"
      FREQTRADE__API_SERVER__ENABLE_OPENAPI: "false"
      FREQTRADE__DRY_RUN: "true"
      SIMULATION_POLICY_FILE: /freqtrade/user_data/simulation-policy.json
      FREQTRADE__API_SERVER__USERNAME: "${FREQTRADE_UI_USERNAME:?set in private .env}"
      FREQTRADE__API_SERVER__PASSWORD: "${FREQTRADE_UI_PASSWORD:?set in private .env}"
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: "${FREQTRADE_UI_JWT:?set in private .env}"
      FREQTRADE__API_SERVER__WS_TOKEN: "${FREQTRADE_UI_WS_TOKEN:?set in private .env}"
    volumes:
      - ./user_data/config.dryrun.json:/freqtrade/user_data/config.dryrun.json:ro
      - ./user_data/strategies:/freqtrade/user_data/strategies:ro
      - ./supervisor/paper_policy.py:/freqtrade/user_data/strategies/paper_policy.py:ro
      - ./simulation-policy.json:/freqtrade/user_data/simulation-policy.json:ro
      - ./user_data/reports:/freqtrade/room-reports:ro
      - ./supervisor/engine_healthcheck.py:/freqtrade/user_data/engine_healthcheck.py:ro
      - freqtrade_runtime:/freqtrade/runtime
    command: >
      trade
      --logfile /freqtrade/runtime/freqtrade.log
      --db-url sqlite:////freqtrade/runtime/trades-market-room-100eur-20261009.dryrun.sqlite
      --config /freqtrade/user_data/config.dryrun.json
      --strategy MoussaMarketRoom
    healthcheck:
      test: ["CMD", "python", "/freqtrade/user_data/engine_healthcheck.py"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 4

  supervisor:
    image: python:3.12-slim@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
    container_name: ai-trading-supervisor
    restart: unless-stopped
    depends_on:
      freqtrade:
        condition: service_healthy
    volumes:
      - freqtrade_runtime:/app/runtime:ro
      - ./user_data/reports:/app/reports
      - /var/lib/jarvis/runtime/trading:/app/jarvis-trading
      - ./supervisor:/app/supervisor:ro
      - ./simulation-policy.json:/app/simulation-policy.json:ro
    environment:
      FREQTRADE_API_URL: http://freqtrade:8080
      FREQTRADE_API_USERNAME: "${FREQTRADE_UI_USERNAME:?set in private .env}"
      FREQTRADE_API_PASSWORD: "${FREQTRADE_UI_PASSWORD:?set in private .env}"
      SIMULATION_START_BALANCE_EUR: "100"
      SIMULATION_POLICY_FILE: /app/simulation-policy.json
      FREQTRADE_DB_NAME: trades-market-room-100eur-20261009.dryrun.sqlite
      RUNTIME_DIR: /app/runtime
      REPORTS_DIR: /app/reports
      JARVIS_REPORT_FILE: /app/jarvis-trading/latest.json
      ACTIVE_STRATEGY: MoussaMarketRoom
      STRATEGY_VALIDATION_STATE: research_only
      GITHUB_REPO: mimzyflow/ai-trading-supervisor
      GITHUB_STATUS_ISSUE: "1"
      GITHUB_STATUS_TOKEN: ${GITHUB_STATUS_TOKEN:-}
      REPORT_INTERVAL_SECONDS: "300"
      PUBLISH_INTERVAL_SECONDS: "3600"
    working_dir: /app
    command: python supervisor/loop.py
    healthcheck:
      test: ["CMD", "python", "/app/supervisor/healthcheck.py"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  freqtrade_runtime:
    name: ai-trading-freqtrade-runtime
    external: true
